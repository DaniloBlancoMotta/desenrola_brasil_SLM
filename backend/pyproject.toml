[project]
name = "desenrola-agente"
version = "0.1.0"
description = "Agente conversacional sobre os dados do programa Desenrola (Banco Central)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pandas>=2.2",
    "plotly>=5.24",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
